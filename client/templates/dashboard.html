<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stargate Telemetry Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Stargate Telemetry Dashboard</h1>
      <p class="subtitle">Live capsule status across all subsystems</p>
    </header>

    <main class="layout">
      <section class="controls">
        <h2>Controls</h2>
        <div class="control-group">
          <label for="spacecraft">Spacecraft ID</label>
          <input id="spacecraft" type="text" placeholder="All spacecraft" />
        </div>
        <fieldset>
          <legend>Telemetry Channels</legend>
          <div class="channels">
            <label><input type="checkbox" value="lifeSupport" checked /> Life Support</label>
            <label><input type="checkbox" value="crew" /> Crew Health</label>
            <label><input type="checkbox" value="navigation" checked /> Navigation</label>
            <label><input type="checkbox" value="power" checked /> Power</label>
            <label><input type="checkbox" value="thermal" checked /> Thermal</label>
            <label><input type="checkbox" value="propulsion" checked /> Propulsion</label>
            <label><input type="checkbox" value="communications" /> Communications</label>
            <label><input type="checkbox" value="structural" /> Structural</label>
          </div>
        </fieldset>

        <div class="buttons">
          <button id="start">Start</button>
          <button id="stop">Stop</button>
          <button id="quit" class="secondary">Quit</button>
        </div>
      </section>

      <div class="data-column">
        <section class="overview">
          <h2>Capsule Overview</h2>
          <div id="capsule-status" class="card-grid"></div>
        </section>

        <section class="details">
          <h2>Detailed Telemetry</h2>
          <div id="telemetry-table" class="detail-grid"></div>
        </section>
      </div>
    </main>

    <template id="status-card-template">
      <div class="card">
        <h3 class="card-title"></h3>
        <p class="card-body"></p>
      </div>
    </template>

    <script type="module" src="/static/dashboard.js"></script>
  </body>
</html>
